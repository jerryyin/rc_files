# TERM seen by programs inside tmux.
set -g default-terminal "xterm-256color"
# Tell tmux the outer terminal supports 24-bit color (so it stops rounding to 256) and OSC 8 hyperlinks (so it passes them through instead of stripping them).
set -as terminal-features ",xterm-256color:RGB:hyperlinks"
# Give panes the 24-bit color tmux now supports; tmux rounds colors itself for terminals that lack it, so this is safe for any attached terminal.
set-environment -g COLORTERM truecolor
# Claude Code clamps to 256 colors under tmux unless this is set.
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# Undercurl Support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# Needs tmux-3.0
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Check and override if we are in WSL (tmux-3.0 + windows terminal)
# We assume ssh connection is open via WSL
if-shell 'test -n "$WSL_DISTRO_NAME" || test -n "$SSH_CONNECTION"' {
  set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
}

# Wait up to 50 ms for the rest of an escape sequence. At 0, a paste-end marker split across two reads is taken as a lone Escape, and tmux then forwards every key, the prefix included, as part of a paste that never ends. Set before tmux-sensible loads, which replaces only the default 500 with 0.
set -s escape-time 50

set-option -g default-command "zsh -l"
# Automatically set window title
set-window-option -g automatic-rename on
set -g allow-rename on
set-option -g set-titles on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @resurrect-strategy-vim 'session'
if-shell 'test -f "$HOME/.tmux/plugins/tpm/tpm"' {
  run-shell '"$HOME/.tmux/plugins/tpm/tpm"'
}
source-file ~/.config/tmux/common.conf
bind r source-file ~/.tmux.conf
bind -T off F10 source-file ~/.tmux.conf \; set -g key-table root \; refresh-client -S

# Give the side-by-side columns equal widths without touching any pane heights.
# Columns are the panes on the top row; resizing one resizes its whole column.
# Linux only: the command is a POSIX shell pipeline, and psmux runs PowerShell.
set -g @even-columns 'tmux list-panes -t "#{window_id}" -F "##{pane_top} ##{pane_left} ##{pane_id}" | sort -n -k1,1 -k2,2 | awk -v W="#{window_width}" "NR==1{t=\$1} \$1==t{id[n++]=\$3} END{c=int((W-(n-1))/n); for(i=0;i<n-1;i++) print id[i], c}" | while read -r p c; do tmux resize-pane -t "$p" -x "$c"; done'
bind-key = run-shell '#{E:@even-columns}'
bind-key -T resize = run-shell '#{E:@even-columns}' \; switch-client -T resize

# Ask about selected text beside the agent (a) or below it (s).
bind-key -T copy-mode-vi a send-keys -X copy-pipe-no-clear '~/.config/tmux/ask-agent.sh open #{pane_id}'
bind-key -T copy-mode-vi s send-keys -X copy-pipe-no-clear '~/.config/tmux/ask-agent.sh open #{pane_id} bottom'
