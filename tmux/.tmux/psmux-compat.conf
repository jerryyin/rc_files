# Windows equivalents of the plugins declared in rc_files/tmux/.tmux.conf.
# [navigation]
bind-key -r Left select-pane -L
bind-key -r Right select-pane -R
bind-key -r Up select-pane -U
bind-key -r Down select-pane -D

# [native]
set -g default-shell pwsh
set -g set-clipboard on
bind r source-file ~/.psmux.conf

# [tpm]
set -g @plugin 'psmux-plugins/ppm'
bind-key I run-shell '"~/.psmux/plugins/ppm/scripts/install_plugins.ps1"'
bind-key U run-shell '"~/.psmux/plugins/ppm/scripts/update_plugins.ps1"'
bind-key M-u run-shell '"~/.psmux/plugins/ppm/scripts/clean_plugins.ps1"'

# [tmux-sensible]
set -g escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g status-keys emacs
set -g focus-events on
bind-key C-p previous-window
bind-key C-n next-window
bind-key R source-file ~/.psmux.conf

# [tmux-pain-control]
bind-key h select-pane -L
bind-key C-h select-pane -L
bind-key C-BSpace select-pane -L
bind-key j select-pane -D
bind-key C-j select-pane -D
bind-key k select-pane -U
bind-key C-k select-pane -U
bind-key l select-pane -R
bind-key C-l select-pane -R
bind-key -r H resize-pane -L %PANE_RESIZE%
bind-key -r J resize-pane -D %PANE_RESIZE%
bind-key -r K resize-pane -U %PANE_RESIZE%
bind-key -r L resize-pane -R %PANE_RESIZE%
bind-key -r "<" swap-window -d -t -1
bind-key -r ">" swap-window -d -t +1
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key '\' split-window -fh -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"
bind-key "%" split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# [tmux-yank]
bind-key y run-shell 'pwsh -NoProfile -File "%MUX_SCRIPT%" -Action CopyLine'
bind-key Y run-shell 'pwsh -NoProfile -File "%MUX_SCRIPT%" -Action CopyDirectory'
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Y send-keys -X copy-selection-and-cancel \; paste-buffer -p
bind-key -T copy-mode-vi M-y send-keys -X copy-selection-and-cancel \; paste-buffer -p
bind-key -T copy-mode-vi ! send-keys -X copy-pipe-and-cancel 'pwsh -NoProfile -Command "Set-Clipboard -Value ([Console]::In.ReadToEnd().TrimEnd([char]10,[char]13))"'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# [tmux-resurrect]
set -g @plugin 'psmux-plugins/psmux-resurrect'
set -g @resurrect-save-unnamed on
bind-key C-s run-shell 'pwsh -NoProfile -File "%PLUGIN_ROOT%/psmux-resurrect/scripts/save.ps1"'
bind-key C-r run-shell 'pwsh -NoProfile -File "%PLUGIN_ROOT%/psmux-resurrect/scripts/restore.ps1"'
