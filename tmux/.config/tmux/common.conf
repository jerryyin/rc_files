set -g prefix `
set -g prefix2 C-b
bind-key ` send-prefix
bind-key C-b send-prefix -2

# Vim style buffer navigation
set -g status-keys vi
setw -g mode-keys vi
set-window-option -g mode-keys vi

# Split windows either vertically or horizontally
bind-key v split-window -h -c "#{pane_current_path}"
bind-key S split-window -c "#{pane_current_path}"
# Create a vertical (horizontal division) split with 20% height of the current pane
bind-key s split-window -v -l "20%" -c "#{pane_current_path}"

# Go to the last command
bind-key b copy-mode\;\
           send-keys -X start-of-line\;\
           send-keys -X search-backward âžœ

bind-key -r Left select-pane -L
bind-key -r Right select-pane -R
bind-key -r Up select-pane -U
bind-key -r Down select-pane -D

bind-key h select-pane -L
bind-key C-h select-pane -L
bind-key C-BSpace select-pane -L
bind-key j select-pane -D
bind-key C-j select-pane -D
bind-key k select-pane -U
bind-key C-k select-pane -U
bind-key l select-pane -R
bind-key C-l select-pane -R
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5
bind-key -r "<" swap-window -d -t -1
bind-key -r ">" swap-window -d -t +1
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key '\' split-window -fh -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"
bind-key "%" split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# F10 passes keys through to a nested session until pressed again.
bind -T root F10 set -g prefix None \; set -g prefix2 None \; set -g key-table off \; if -F '#{pane_in_mode}' 'send-keys -X cancel' \; refresh-client -S

set -g mouse on
set -g set-clipboard on
set -g status-style bg=default

# Gruvbox Material Dark Hard.
set -g status-justify "left"
set -g status "on"
set -g status-left-style "none"
set -g message-command-style "fg=#d4be98,bg=#504945"
set -g status-right-style "none"
set -g pane-active-border-style "fg=#a89984"
set -g message-style "fg=#d4be98,bg=#504945"
set -g pane-border-style "fg=#504945"
set -g status-right-length "100"
set -g status-left-length "100"
setw -g window-status-activity-style "none"
setw -g window-status-separator ""
# Width/80 is zero on narrow terminals; integer division works on both platforms.
set -g status-left "#{?#{e|/:#{client_width},80},#[fg=#1d2021#,bg=#a89984] #S #[fg=#a89984#,bg=NONE#,nobold#,nounderscore#,noitalics],}"
set -g status-right "#{?#{e|/:#{client_width},80},#[fg=#504945#,bg=NONE#,nobold#,nounderscore#,noitalics] #{?#{==:#{key_table},off},OFF,} #[fg=#d4be98#,bg=#504945] %Y-%m-%d | %H:%M #[fg=#a89984#,bg=#504945#,nobold#,nounderscore#,noitalics]#[fg=#1d2021#,bg=#a89984] #h ,#{?#{==:#{key_table},off},OFF,}}"
setw -g window-status-format "#[fg=#d4be98,bg=NONE] #I |#[fg=#d4be98,bg=NONE] #W "
setw -g window-status-current-format "#[fg=NONE,bg=#504945,nobold,nounderscore,noitalics]#[fg=#d4be98,bg=#504945] #I |#[fg=#d4be98,bg=#504945] #W #[fg=#504945,bg=NONE,nobold,nounderscore,noitalics]"
