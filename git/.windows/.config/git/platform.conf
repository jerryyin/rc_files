[safe]
	directory = *
[core]
	sshCommand = C:/Windows/System32/OpenSSH/ssh.exe
# AMD-Triton repositories are visible only to the enterprise account behind github-e.
[url "git@github-e:AMD-Triton/"]
	insteadOf = git@github.com:AMD-Triton/
	insteadOf = https://github.com/AMD-Triton/
[url "ssh://git@github-e/AMD-Triton/"]
	insteadOf = ssh://git@github.com/AMD-Triton/
# Use the personal SSH key for other github.com HTTPS URLs, independent of gh's active account.
# The longest matching prefix wins, so AMD-Triton URLs keep the enterprise route above.
[url "git@github.com:"]
	insteadOf = https://github.com/
